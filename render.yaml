# Render Blueprint for ICEWISE Routing Backend
services:
  - type: web
    name: icewise-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/routing/requirements.txt
    startCommand: uvicorn backend.routing.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "https://icewise.vercel.app,https://icewise-backend.onrender.com,http://localhost:3000,http://localhost:8000"
